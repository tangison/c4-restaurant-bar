<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline | C4 Restaurant &amp; Bar</title>
<meta name="robots" content="noindex" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #1a2e57;
    color: #fff;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    gap: 0;
  }
  img.logo { height: 84px; width: auto; animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  h1 { font-size: 1.9rem; letter-spacing: -0.03em; margin: 2rem 0 0.6rem; font-weight: 700; }
  p { color: #bcbbb9; font-size: 0.95rem; line-height: 1.6; max-width: 24rem; }
  .row { margin-top: 1.6rem; display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; }
  a.btn, button.btn {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.8rem 1.4rem;
    font-size: 0.9rem; font-weight: 600; text-decoration: none;
    border: 1px solid rgba(255,255,255,0.4); color: #fff; background: transparent;
    cursor: pointer;
  }
  a.btn.primary { background: #fff; color: #223a6c; border-color: #fff; }
  .tel { color: #fff; font-weight: 600; }
</style>
</head>
<body>
  <img class="logo" src="/brand/icon-knockout.svg" alt="C4 Restaurant and Bar" />
  <h1>The connection dropped.</h1>
  <p>Your device is offline right now. Reconnect and the menu, the patio and the bar are all still here.</p>
  <div class="row">
    <button class="btn primary" type="button" onclick="location.reload()">Try again</button>
    <a class="btn" href="tel:+264837837780">Call <span class="tel">083 783 7780</span></a>
    <a class="btn" href="tel:+264814006471">Mobile <span class="tel">081 400 6471</span></a>
  </div>
  <p style="margin-top:1.4rem; font-size:0.8rem;">Signal comes and goes on the corner. The kitchen does not.</p>
</body>
</html>
